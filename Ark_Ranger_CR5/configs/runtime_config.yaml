runtime:
  mode: "compat"
  input_source: "tcp_json"

  compat:
    enable_ark_patch: false
    enable_ark_subscription: false
    enable_adapters: true
    enable_ark_lcm: false
    enable_degraded_fallback: false
    degraded_input_source: "tcp_json"

  ros2:
    enabled: true
    force_enable: false
    node_name: "ark_ranger_r3"
    action_name: "/r3/command"
    qos_depth: 10
    status_interval_s: 0.1
    topics:
      events: "/r3/events"
      status: "/r3/status"
      validation: "/r3/validation"
    action:
      result_timeout_s: 3.0
      complete_on_accept: false

  adapters:
    local_terminal:
      prompt: "r3-json> "
      help_on_start: true
    ros2:
      topic: "/robot/action"
      node_name: "ark_ranger_r3_adapter"
    tcp_json:
      host: "0.0.0.0"
      port: 58000
      max_line_bytes: 1048576
      accept_timeout_s: 0.5

  health:
    require_lcm: false
    require_arktypes: false

  safety:
    max_pose_deviation_m: 0.40
    max_joint_deviation_rad: 1.20

  logging:
    root_dir: "reports/logs"

  status_output:
    enabled: true
    destination: "auto"
    interval_s: 1.0
    pose_precision: 3
    arm_precision: 4
    grip_precision: 4
    live_status_file: "reports/live_status/current_status.json"

  ik:
    max_retries: 3

  gripper:
    stall_error_threshold: 0.03
    movement_threshold: 0.0001
    stall_steps: 45
